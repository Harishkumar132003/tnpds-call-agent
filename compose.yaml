# Deploys the voice agent and the portal next to the Postgres, Qdrant and nginx
# that already run on this server. Both services join the external
# `shared-app-network` (the one dev-nginx is on), so nginx proxies to them by
# container name:
#     callagent.wizzgeeks.com   -> http://voice-agent-bot:7860
#     agentportal.wizzgeeks.com -> http://voice-agent-portal:8090
# No ports are published on the host; nginx is the only way in.
#
#   cp backend/.env.docker.example backend/.env.docker   # container-side hostnames + PUBLIC_HOST
#   docker compose build
#   docker compose up -d
#
# backend/.env holds the secrets (shared with local runs); backend/.env.docker
# overrides only the URLs that must point at container names instead of
# localhost. Neither file is baked into the image.

x-common: &common
  image: voice-agent:latest
  env_file:
    - backend/.env
    - backend/.env.docker
  networks:
    - shared-app-network
  extra_hosts:
    # lets a container reach services published on the host (e.g. Qdrant on :6333)
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  bot:
    <<: *common
    build: .
    container_name: voice-agent-bot
    # PUBLIC_HOST and BOT_TRANSPORT come from backend/.env.docker (the bot turns
    # them into --proxy and -t). BOT_ARGS adds extra runner flags if ever needed,
    # e.g. "--allowed-origins https://agentportal.wizzgeeks.com".
    command: python bot.py --host 0.0.0.0 --port 7860 ${BOT_ARGS:-}
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g

  portal:
    <<: *common
    container_name: voice-agent-portal
    depends_on:
      bot:
        condition: service_started
    environment:
      PORTAL_HOST: 0.0.0.0
      PORTAL_PORT: 8090
    command: python portal.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/stats', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g

networks:
  shared-app-network:
    external: true

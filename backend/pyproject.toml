[project]
name = "voice-agent-poc"
version = "0.1.0"
description = "Multilingual Indian-language voice AI agent built with Pipecat and Sarvam AI."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Exact pin: the code is written against the 1.12.0 service/transport APIs.
    "pipecat-ai[sarvam,silero,webrtc,openai,runner]==1.12.0",
    "pydantic-settings>=2.6,<3",
    "loguru>=0.7,<0.8",
    "asyncpg>=0.32.0",
    "qdrant-client>=1.12,<2",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1,<4",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "reportlab>=4,<5",
    "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that call real external services (need credentials)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
